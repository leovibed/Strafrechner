<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strafrechner - Narco City Police Department</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #eab308;
            --text-color: #f8fafc;
            --border-color: #334155;
            --hover-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header img {
            max-width: 130px;
            height: auto;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 5px 0;
            color: var(--accent);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .paragraph-list {
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
        }

        .paragraph-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.2s;
        }

        .paragraph-item:hover {
            background-color: var(--hover-color);
        }

        .paragraph-item input[type="checkbox"] {
            margin-right: 15px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .paragraph-info {
            flex-grow: 1;
        }

        .paragraph-title {
            font-weight: bold;
            color: var(--accent);
        }

        .paragraph-details {
            font-size: 13px;
            color: #94a3b8;
        }

        .calc-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .calc-btn:hover {
            opacity: 0.9;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.3);
        }

        .modal-header {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin: 10px 0;
        }

        .close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <!-- Narco City Police Department Logo -->
        <img src="https://i.ibb.co/L5k6v7F/ncpd-logo.png" alt="Narco City Police Department Logo" id="logoImg">
        <h1>Narco City Police Department</h1>
        <div style="color: #94a3b8; font-size: 14px;">Bußgeld- & Strafeinheitenrechner</div>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="Paragraf oder Straftatbestand suchen..." onkeyup="filterParagraphs()">

    <div class="paragraph-list" id="paragraphContainer">
        <!-- Dynamisch eingefügte Paragrafen -->
    </div>

    <button class="calc-btn" onclick="calculateStrafen()">Berechnen</button>
</div>

<!-- Ergebnis Modal -->
<div class="modal" id="resultModal">
    <div class="modal-content">
        <div class="modal-header">Gesamtstrafe</div>
        <div id="selectedList" style="font-size: 14px; color: #cbd5e1; margin-bottom: 15px;"></div>
        <div class="result-row">
            <span>Gesamte Geldstrafe:</span>
            <span id="totalFine" style="color: #4ade80; font-weight: bold;">0$</span>
        </div>
        <div class="result-row">
            <span>Hafteinheiten (HE):</span>
            <span id="totalHE" style="color: #f87171; font-weight: bold;">0 HE</span>
        </div>
        <button class="close-btn" onclick="closeModal()">Schließen</button>
    </div>
</div>

<script>
const paragrafen = [
    { section: "§ 9", title: "Fahren ohne Fahrerlaubnis (Abs. 1)", fine: 10000, he: 0 },
    { section: "§ 9", title: "Fahren ohne Fahrerlaubnis (Abs. 2 - Führerschein verwahrt/beschlagnahmt)", fine: 20000, he: 10 },
    { section: "§ 9", title: "Fahren ohne Fahrerlaubnis (Abs. 3 - Nichtmitführen)", fine: 2500, he: 0 },
    { section: "§ 10", title: "Kennzeichenmissbrauch", fine: 40000, he: 25 },
    { section: "§ 11", title: "Missbräuchliches Ausgeben oder Besitz von Kennzeichen", fine: 20000, he: 20 },
    { section: "§ 12", title: "Lärmbelästigung mit Kraftfahrzeugen", fine: 15000, he: 0 },
    { section: "§ 13", title: "Unerlaubtes Entfernen vom Unfallort mit Sachschaden", fine: 20000, he: 0 },
    { section: "§ 14", title: "Unerlaubtes Entfernen vom Unfallort mit Personenschaden", fine: 40000, he: 10 },
    { section: "§ 15", title: "Verursachen eines Sachschadens", fine: 10000, he: 0 },
    { section: "§ 16", title: "Vorschriftswidriges Fahren abseits der Fahrbahn", fine: 10000, he: 0 },
    { section: "§ 17", title: "Fahren auf der falschen Fahrbahnseite", fine: 12500, he: 0 },
    { section: "§ 18", title: "Fahren auf der falschen Fahrbahnseite - Highway", fine: 25000, he: 0 },
    { section: "§ 19", title: "Fahren auf der falschen Fahrbahnseite mit Unfall", fine: 35000, he: 0 },
    { section: "§ 20", title: "Verursachen eines Unfalls unter Missachtung der Sorgfaltspflicht", fine: 25000, he: 0 },
    { section: "§ 21", title: "Geschwindigkeitsüberschreitung - innerorts", fine: 10000, he: 0 },
    { section: "§ 22", title: "Geschwindigkeitsüberschreitung - außerorts", fine: 15000, he: 0 },
    { section: "§ 23", title: "Halten oder Parken im Bereich einer Verkehrsmündung, -kreuzung oder Kurve", fine: 5000, he: 0 },
    { section: "§ 24", title: "Halten oder Parken im Bereich von Ein- und Ausfahrten für Einsatzkräfte", fine: 30000, he: 0 },
    { section: "§ 25", title: "Halten oder Parken im Fahrbahnbereich - innerorts", fine: 10000, he: 0 },
    { section: "§ 26", title: "Halten oder Parken im Fahrbahnbereich - außerorts", fine: 20000, he: 0 },
    { section: "§ 27", title: "Halten oder Parken im Fahrbahnbereich - Highway", fine: 30000, he: 0 },
    { section: "§ 28", title: "Halten oder Parken auf Fußwegen, Sperrflächen, Grünstreifen", fine: 10000, he: 0 },
    { section: "§ 29", title: "Parken in Bereichen mit roter Randsteinmarkierung", fine: 10000, he: 0 },
    { section: "§ 30", title: "Mangelnde Beleuchtung in Abhängigkeit der Lichtverhältnisse", fine: 7500, he: 0 },
    { section: "§ 31", title: "Beförderung von Personen ohne Sitzgelegenheit", fine: 15000, he: 0 },
    { section: "§ 32", title: "Unterbrechen einer geschlossenen Fahrzeugkolonne", fine: 20000, he: 0 },
    { section: "§ 33", title: "Verkehrswidriges Führen einer geschlossenen Fahrzeugkolonne als Verantwortlicher", fine: 40000, he: 0 },
    { section: "§ 34", title: "Missachten mobiler polizeilicher Absperreinrichtungen", fine: 25000, he: 0 },
    { section: "§ 35", title: "Missachten von Einsatzkräften mit eingeschaltetem Blaulicht", fine: 10000, he: 0 },
    { section: "§ 36", title: "Missachtung der Sorgfalt an erkennbaren Einsatzorten mit Unfall", fine: 20000, he: 0 },
    { section: "§ 37", title: "Nicht Mitführen von Reparatur und Erste-Hilfe Material", fine: 5000, he: 0 },
    { section: "§ 38", title: "Führen eines Kraftfahrzeugs unter Drogeneinfluss", fine: 15000, he: 10 },
    { section: "§ 39", title: "Führen eines Kraftfahrzeugs unter Drogeneinfluss mit Gefährdung", fine: 20000, he: 15 },
    { section: "§ 40", title: "Führen eines Kraftfahrzeugs unter Drogeneinfluss mit Unfall", fine: 25000, he: 20 },
    { section: "§ 41", title: "Teilnahme an einem Kraftfahrzeugrennen", fine: 20000, he: 0 },
    { section: "§ 42", title: "Teilnahme an einem Kraftfahrzeugrennen mit Gefährdung", fine: 20000, he: 10 },
    { section: "§ 43", title: "Teilnahme an einem Kraftfahrzeugrennen mit Unfall", fine: 25000, he: 20 },
    { section: "§ 44", title: "Verwendung unerlaubter Fahrzeugmodifikationen (z.B. Nitro)", fine: 15000, he: 0 },
    { section: "§ 45", title: "Fahren eines Kraftfahrzeugs unter Beschädigung der Sicherheitseinrichtungen", fine: 10000, he: 0 },
    { section: "§ 46", title: "Gefährlicher Eingriff in den Straßenverkehr", fine: 20000, he: 20 },
    { section: "§ 47", title: "Unbefugter Gebrauch eines Fahrzeugs", fine: 12500, he: 0 }
];

function loadParagraphs() {
    const container = document.getElementById('paragraphContainer');
    container.innerHTML = '';
    
    paragrafen.forEach((p, index) => {
        const item = document.createElement('div');
        item.className = 'paragraph-item';
        item.innerHTML = `
            <input type="checkbox" id="p-${index}" data-fine="${p.fine}" data-he="${p.he}" data-title="${p.section} - ${p.title}">
            <label for="p-${index}" class="paragraph-info">
                <div class="paragraph-title">${p.section} ${p.title}</div>
                <div class="paragraph-details">Geldstrafe: ${p.fine.toLocaleString()}$ | Hafteinheiten: ${p.he} HE</div>
            </label>
        `;
        container.appendChild(item);
    });
}

function filterParagraphs() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const items = document.querySelectorAll('.paragraph-item');
    
    items.forEach(item => {
        const text = item.innerText.toLowerCase();
        if (text.includes(query)) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}

function calculateStrafen() {
    let totalFine = 0;
    let totalHE = 0;
    let selectedText = [];

    const checkboxes = document.querySelectorAll('.paragraph-item input[type="checkbox"]:checked');
    
    checkboxes.forEach(cb => {
        totalFine += parseInt(cb.getAttribute('data-fine'));
        totalHE += parseInt(cb.getAttribute('data-he'));
        selectedText.push("• " + cb.getAttribute('data-title'));
    });

    document.getElementById('totalFine').innerText = totalFine.toLocaleString() + "$";
    document.getElementById('totalHE').innerText = totalHE + " HE";
    document.getElementById('selectedList').innerHTML = selectedText.length > 0 
        ? "<b>Ausgewählte Delikte:</b><br>" + selectedText.join("<br>") 
        : "Keine Delikte ausgewählt";

    document.getElementById('resultModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('resultModal').style.display = 'none';
}

// Initialisieren
loadParagraphs();
</script>

</body>
</html>
